# Subify OS — local development Postgres
# Credentials must match api/Subify.Api/appsettings*.json (task 2.3.11).
# Override via docker/.env (see .env.example).

services:
  postgres:
    image: postgres:15-alpine
    container_name: subify_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subify_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-subify_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subify_admin} -d ${POSTGRES_DB:-subify_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
